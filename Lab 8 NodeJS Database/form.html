<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create Account</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        label { display:block; margin-top: 10px; }
        input { width: 300px; padding: 6px; }
        button { margin-top: 12px; padding: 8px 12px; }
    </style>
</head>
<body>
    <h1>Please create a new user account:</h1>
    <form action="/insert" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" maxlength="40" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" maxlength="40" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" maxlength="40" required>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
